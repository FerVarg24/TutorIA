<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" fill="none">
  <!-- Body -->
  <rect x="24" y="44" width="48" height="40" rx="12" fill="#1f1633" stroke="#6a5fc1" stroke-width="2"/>

  <!-- Head -->
  <rect x="20" y="14" width="56" height="40" rx="16" fill="#150f23" stroke="#6a5fc1" stroke-width="2"/>

  <!-- Ear wings (owl-like) -->
  <polygon points="22,16 14,4 30,12" fill="#6a5fc1"/>
  <polygon points="74,16 82,4 66,12" fill="#6a5fc1"/>

  <!-- Eyes (big round robot/owl eyes) -->
  <circle cx="35" cy="32" r="10" fill="#ffffff"/>
  <circle cx="61" cy="32" r="10" fill="#ffffff"/>
  <!-- Eye inner glow ring -->
  <circle cx="35" cy="32" r="7" fill="#c2ef4e" opacity="0.25"/>
  <circle cx="61" cy="32" r="7" fill="#c2ef4e" opacity="0.25"/>
  <!-- Pupils -->
  <circle cx="36" cy="33" r="4.5" fill="#150f23"/>
  <circle cx="62" cy="33" r="4.5" fill="#150f23"/>
  <!-- Eye shine -->
  <circle cx="38" cy="31" r="1.5" fill="#ffffff"/>
  <circle cx="64" cy="31" r="1.5" fill="#ffffff"/>

  <!-- Beak / mouth panel -->
  <rect x="38" y="44" width="20" height="8" rx="4" fill="#362d59"/>
  <rect x="42" y="46.5" width="12" height="3" rx="1.5" fill="#c2ef4e" opacity="0.7"/>

  <!-- Antenna -->
  <line x1="48" y1="14" x2="48" y2="6" stroke="#6a5fc1" stroke-width="2" stroke-linecap="round"/>
  <circle cx="48" cy="5" r="3" fill="#c2ef4e"/>

  <!-- Chest panel -->
  <rect x="32" y="54" width="32" height="20" rx="6" fill="#1a1030" stroke="#362d59" stroke-width="1.5"/>
  <!-- Chest LED row -->
  <circle cx="40" cy="62" r="3" fill="#c2ef4e" opacity="0.9"/>
  <circle cx="48" cy="62" r="3" fill="#6a5fc1" opacity="0.9"/>
  <circle cx="56" cy="62" r="3" fill="#c2ef4e" opacity="0.5"/>
  <!-- Chest stripe -->
  <rect x="36" y="68" width="24" height="2" rx="1" fill="#362d59"/>

  <!-- Arms -->
  <rect x="10" y="50" width="14" height="8" rx="4" fill="#1f1633" stroke="#6a5fc1" stroke-width="1.5"/>
  <rect x="72" y="50" width="14" height="8" rx="4" fill="#1f1633" stroke="#6a5fc1" stroke-width="1.5"/>

  <!-- Feet -->
  <rect x="30" y="82" width="14" height="8" rx="4" fill="#6a5fc1"/>
  <rect x="52" y="82" width="14" height="8" rx="4" fill="#6a5fc1"/>
</svg>
